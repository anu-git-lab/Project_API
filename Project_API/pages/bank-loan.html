<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bank Loan</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="../css/style.css"></head><body><div class="container py-4"><a href="../index.html">← Home</a><h1 class="mt-3">Bank Loan Management</h1><p class="text-secondary">Uses the documented BankLoan endpoints.</p><div id="alert"></div><div class="row g-4"><div class="col-lg-5"><div class="card shadow-sm"><div class="card-body"><h5>Submit Loan Application</h5><form id="loanForm"><input class="form-control mb-2" id="fullName" placeholder="Full name" required><input class="form-control mb-2" id="panCard" placeholder="PAN card" required><input class="form-control mb-2" id="email" type="email" placeholder="Email" required><input class="form-control mb-2" id="phone" placeholder="Phone"><input class="form-control mb-2" id="annualIncome" type="number" placeholder="Annual income"><input class="form-control mb-2" id="creditScore" type="number" placeholder="Credit score"><input class="form-control mb-2" id="customerId" type="number" placeholder="Customer ID"><button class="btn btn-primary">Submit Application</button></form></div></div></div><div class="col-lg-7"><button class="btn btn-outline-primary" id="load">Load All Applications</button><pre class="json-box mt-3" id="output">No data loaded.</pre></div></div></div><script src="../js/api.js"></script><script>
loanForm.addEventListener("submit",async e=>{e.preventDefault();try{let body={fullName:fullName.value,panCard:panCard.value,email:email.value,phone:phone.value,annualIncome:Number(annualIncome.value)||0,creditScore:Number(creditScore.value)||0,customerId:Number(customerId.value)||0};let r=await apiPost("/BankLoan/AddNewApplication",body);showAlert(r.result===false?"danger":"success",r.message||"Application submitted.");}catch(x){showAlert("danger",x.message)}});load.onclick=async()=>{try{renderJson("output",dataOf(await apiGet("/BankLoan/GetAllApplications")))}catch(x){showAlert("danger",x.message)}};</script></body></html>
