<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bus Booking</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="../css/style.css"></head><body><div class="container py-4"><a href="../index.html">← Home</a><h1 class="mt-3">Bus Booking</h1><div id="alert"></div><div class="card shadow-sm"><div class="card-body"><h5>Search Buses</h5><div class="row g-2"><div class="col-md-4"><input id="from" type="number" class="form-control" placeholder="From location ID"></div><div class="col-md-4"><input id="to" type="number" class="form-control" placeholder="To location ID"></div><div class="col-md-4"><input id="date" type="date" class="form-control"></div></div><button id="search" class="btn btn-primary mt-3">Search</button></div></div><div id="results" class="row g-3 mt-2"></div></div><script src="../js/api.js"></script><script>
search.onclick=async()=>{try{const r=await apiGet("/BusBooking/searchBus?"+query({fromLocation:from.value,toLocation:to.value,travelDate:date.value}));const list=dataOf(r)||[];results.innerHTML=(Array.isArray(list)?list:[]).map(b=>`<div class="col-md-6"><div class="card"><div class="card-body"><h5>${escapeHtml(b.busName||"Bus")}</h5><p>Seats: ${escapeHtml(b.availableSeats??"-")}/${escapeHtml(b.totalSeats??"-")}</p><strong>Price: ${escapeHtml(b.price??"-")}</strong></div></div></div>`).join("")||"<p>No buses found.</p>";}catch(x){showAlert("danger",x.message)}}</script></body></html>
