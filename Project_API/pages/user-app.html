<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>User App</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="../css/style.css"></head><body><div class="container py-4"><a href="../index.html">← Home</a><h1 class="mt-3">User App</h1><div id="alert"></div><div class="card card-body shadow-sm"><button id="load" class="btn btn-primary">Load Users</button><button id="logout" class="btn btn-outline-danger ms-2">Clear Session</button><pre id="out" class="json-box mt-3"></pre></div></div><script src="../js/api.js"></script><script>load.onclick=async()=>{try{renderJson("out",dataOf(await apiGet("/UserApp/GetAllUsers")))}catch(x){showAlert("danger",x.message)}};logout.onclick=()=>{sessionStorage.clear();showAlert("success","Session cleared.")};</script></body></html>
