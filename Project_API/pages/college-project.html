<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>College Project</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
</head>

<body>
    <div class="container py-4"><a href="../index.html">← Home</a>
        <h1 class="mt-3">College Project</h1>
        <div id="alert"></div>
        <form id="form" class="card card-body shadow-sm">
            <div class="row g-2"><input id="studentName" class="form-control" placeholder="Student name" required><input
                    id="contactNo" class="form-control" placeholder="Contact number" required><input id="emailId"
                    class="form-control" type="email" placeholder="Email" required><input id="projectTitle"
                    class="form-control" placeholder="Project title" required><input id="department"
                    class="form-control" placeholder="Department" required><input id="course" class="form-control"
                    placeholder="Course" required><input id="technologies" class="form-control"
                    placeholder="Technologies" required><input id="startDate" class="form-control" type="date"
                    required><input id="endDate" class="form-control" type="date" required><input id="userId"
                    class="form-control" type="number" placeholder="User ID" required></div><button
                class="btn btn-primary mt-3">Submit Project</button>
        </form><button id="load" class="btn btn-outline-primary mt-3">Load Projects</button>
        <pre id="out" class="json-box mt-3"></pre>
    </div>
    <script src="../js/api.js"></script>
    <script>
        form.onsubmit = async e => {e.preventDefault(); try {let b = {studentName: studentName.value, contactNo: contactNo.value, emailId: emailId.value, projectTitle: projectTitle.value, department: department.value, course: course.value, technologies: technologies.value, startDate: startDate.value, endDate: endDate.value, userId: Number(userId.value), status: "Draft"}; let r = await apiPost("/CollegeProject/SubmitProject", b); showAlert(r.result === false ? "danger" : "success", r.message || "Submitted.");} catch (x) {showAlert("danger", x.message)} }; load.onclick = async () => {try {renderJson("out", dataOf(await apiGet("/CollegeProject/getAllProjects")))} catch (x) {showAlert("danger", x.message)} };</script>
</body>

</html>
