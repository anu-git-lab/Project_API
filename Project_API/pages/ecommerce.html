<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>E-Commerce</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="../css/style.css"></head><body><div class="container py-4"><a href="../index.html">← Home</a><h1 class="mt-3">E-Commerce</h1><div id="alert"></div><div class="card card-body shadow-sm"><div class="input-group"><input id="userId" type="number" class="form-control" placeholder="User ID"><button id="load" class="btn btn-primary">Load Products</button></div><pre id="out" class="json-box mt-3"></pre></div></div><script src="../js/api.js"></script><script>load.onclick=async()=>{try{renderJson("out",dataOf(await apiGet("/Ecommerce/get-products?"+query({userId:userId.value}))))}catch(x){showAlert("danger",x.message)}};</script></body></html>
