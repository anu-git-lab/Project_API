<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Leave Tracker</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="../css/style.css"></head><body><div class="container py-4"><a href="../index.html">← Home</a><h1 class="mt-3">Leave Tracker</h1><div id="alert"></div><div class="card card-body shadow-sm"><input id="empId" type="number" class="form-control mb-2" placeholder="Employee ID"><button id="load" class="btn btn-primary">Load Employee Leave Requests</button><pre id="out" class="json-box mt-3"></pre></div></div><script src="../js/api.js"></script><script>load.onclick=async()=>{try{renderJson("out",dataOf(await apiGet("/LeaveTracker/GetLeaveRequestsbyEmpId?"+query({empid:empId.value}))))}catch(x){showAlert("danger",x.message)}};</script></body></html>
