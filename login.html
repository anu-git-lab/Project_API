<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login - FreeProject</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-light">
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
      <div class="card shadow">
        <div class="card-body p-4">
          <h2 class="mb-3">API Login</h2>
          <div id="alert"></div>
          <form id="loginForm">
            <div class="mb-3">
              <label class="form-label">Module</label>
              <select id="module" class="form-select">
                <option value="UserApp">User App (JWT)</option>
                <option value="BankLoan">Bank Loan</option>
                <option value="BusBooking">Bus Booking</option>
                <option value="CollegeProject">College Project</option>
                <option value="GoalTracker">Goal Tracker</option>
                <option value="LeaveTracker">Leave Tracker</option>
                <option value="ProjectCompetition">Project Competition</option>
                <option value="Survey">Survey</option>
              </select>
            </div>
            <div class="mb-3" id="emailWrap">
              <label class="form-label">Email / Username</label>
              <input id="identity" class="form-control" required>
            </div>
            <div class="mb-3">
              <label class="form-label">Password</label>
              <input id="password" type="password" class="form-control" required>
            </div>
            <button class="btn btn-primary w-100">Login</button>
          </form>
          <a class="d-block mt-3 text-center" href="index.html">Back to Home</a>
        </div>
      </div>
    </div>
  </div>
</div>
<script src="js/api.js"></script>
<script>
document.getElementById("module").addEventListener("change", e => {
  document.querySelector("#identity").previousElementSibling.textContent =
    e.target.value === "UserApp" ? "Email" : "Username";
});
document.getElementById("loginForm").addEventListener("submit", async e => {
  e.preventDefault();
  const module = document.getElementById("module").value;
  const identity = document.getElementById("identity").value.trim();
  const password = document.getElementById("password").value;
  try {
    const data = await apiPost(`/${module}/login`,
      module === "UserApp" ? {emailId: identity, password} : {userName: identity, password});
    if (data.result === false) return showAlert("danger", data.message || "Login failed");
    if (module === "UserApp") {
      const d = data.data || {};
      if (d.token) sessionStorage.setItem("accessToken", d.token);
      if (d.refreshToken) sessionStorage.setItem("refreshToken", d.refreshToken);
    }
    sessionStorage.setItem("user", JSON.stringify(data.data ?? data));
    showAlert("success", "Login successful.");
  } catch (err) { showAlert("danger", err.message); }
});
</script>
</body>
</html>
