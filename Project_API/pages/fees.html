<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Fees Tracking</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
</head>

<body>
    <div class="container py-4"><a href="../index.html">← Home</a>
        <h1 class="mt-3">Fees Tracking</h1>
        <div id="alert"></div>
        <div class="row g-3">
            <div class="col-md-6">
                <div class="card card-body shadow-sm">
                    <h5>New Enrollment</h5>
                    <form id="form"><input id="studentName" class="form-control mb-2" placeholder="Student name"
                            required><input id="contactNo" class="form-control mb-2" placeholder="Contact number"
                            required><input id="totalFees" class="form-control mb-2" type="number"
                            placeholder="Total fees" required><input id="batchId" class="form-control mb-2"
                            type="number" placeholder="Batch ID" required><select id="status" class="form-select mb-2">
                            <option>Pending</option>
                            <option>Partial</option>
                            <option>Paid</option>
                        </select><button class="btn btn-primary">Add Enrollment</button></form>
                </div>
            </div>
            <div class="col-md-6"><button id="load" class="btn btn-outline-primary">Load Enrollments</button>
                <pre id="out" class="json-box mt-3"></pre>
            </div>
        </div>
    </div>
    <script src="../js/api.js"></script>
    <script>form.onsubmit = async e => {e.preventDefault(); try {let r = await apiPost("/FeesTracking/addNewEnrollment", {studentName: studentName.value, contactNo: contactNo.value, totalFees: Number(totalFees.value), batchId: Number(batchId.value), status: status.value}); showAlert(r.result === false ? "danger" : "success", r.message || "Enrollment added.");} catch (x) {showAlert("danger", x.message)} }; load.onclick = async () => {try {renderJson("out", dataOf(await apiGet("/FeesTracking/getAllEnrollments")))} catch (x) {showAlert("danger", x.message)} };</script>
</body>

</html>
